# Base de données PostgreSQL (valeurs par défaut pour le développement local)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reservationsalles}
spring.datasource.username=${DB_USER:reservationsalles}
spring.datasource.password=${DB_PASSWORD:reservationsalles}

# Hibernate crée / met à jour les tables tout seul (suffisant pour un projet d'apprentissage)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT : en production, définir JWT_SECRET (32 caractères minimum)
app.jwt.secret=${JWT_SECRET:changez-moi-changez-moi-changez-moi-123456}
app.jwt.duree-heures=8

# Compte administrateur créé au premier démarrage
app.admin.email=${ADMIN_EMAIL:admin@reservationsalles.local}
app.admin.mot-de-passe=${ADMIN_PASSWORD:admin123}
