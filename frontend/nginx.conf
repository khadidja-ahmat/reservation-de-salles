server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # les appels /api sont envoyés au backend Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
    }

    # toutes les autres pages : Angular gère la navigation
    location / {
        try_files $uri $uri/ /index.html;
    }
}
