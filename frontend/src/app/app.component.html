<header class="barre">
  <span class="logo">Réservation de salles</span>
  @if (auth.connecte()) {
    <nav>
      <a routerLink="/salles" routerLinkActive="actif">Salles</a>
      <a routerLink="/reservations" routerLinkActive="actif">Réservations</a>
    </nav>
    <span class="utilisateur">
      {{ auth.utilisateur()?.nom }}
      @if (auth.estAdmin()) { <em>(admin)</em> }
      <button (click)="auth.deconnexion()">Déconnexion</button>
    </span>
  }
</header>

<main>
  <router-outlet />
</main>
